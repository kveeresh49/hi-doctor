<p-toast></p-toast>

<div class="mt-0">
    <p-fluid>
        <form [formGroup]="roleForm" (ngSubmit)="onSubmit()">
            <div class="flex mt-[-0.5rem]">
                <div class="card flex flex-col gap-6 w-full">
                    <div class="flex justify-end">
                        <p-button label="Get Predefined Roles" (click)="getPredefinedRoles()"></p-button>
                    </div>
                    <div class="font-semibold text-xl">Add Role</div>

                    <div class="flex flex-col md:flex-row gap-6">
                        <!-- Role Field -->
                        <div class="flex-1 flex flex-col">
                            <label for="Role" class="mb-1">Role</label>
                            <input pInputText id="Role" type="text" formControlName="role" placeholder="Enter Role Name" class="w-full" />
                            <div *ngIf="roleForm.get('role')?.invalid && roleForm.get('role')?.touched" class="text-red-500 text-sm mt-1 min-h-[1.25rem]">Role name is required.</div>
                        </div>

                        <!-- Role Description Field -->
                        <div class="flex-1 flex flex-col">
                            <label for="roleDescription" class="mb-1">Role Description</label>
                            <input pInputText id="roleDescription" type="text" formControlName="roleDescription" placeholder="Enter Role Description" class="w-full" />
                            <div *ngIf="roleForm.get('roleDescription')?.invalid && roleForm.get('roleDescription')?.touched" class="text-red-500 text-sm mt-1 min-h-[1.25rem]">Last name is required.</div>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <div class="flex justify-center mt-4">
                        <p-button label="Submit" (click)="onSubmit()"></p-button>
                    </div>
                </div>
            </div>
        </form>
    </p-fluid>
</div>

<div class="mt-4">
    <p-fluid class="mt-3">
        <p-table #dt1 [value]="roles" dataKey="id" [rows]="10" [rowsPerPageOptions]="[10, 25, 50]" [paginator]="true">
            <ng-template #header>
                <tr>
                    <th style="min-width: 15rem">
                        <div class="flex items-center">
                            Role Name
                            <p-columnFilter type="text" field="role" display="menu" />
                        </div>
                    </th>
                    <th style="min-width: 15rem">
                        <div class="flex items-center">
                            Role Description
                            <p-columnFilter type="text" field="roleDescription" display="menu" />
                        </div>
                    </th>
                    <th style="width: 3rem">
                        <div class="flex items-center">Actions</div>
                    </th>
                </tr>
            </ng-template>
            <ng-template #body let-role>
                <tr>
                    <td>
                        {{ role.role }}
                    </td>
                    <td>
                        <div class="flex items-center gap-2">
                            <span>{{ role.roleDescription }}</span>
                        </div>
                    </td>
                    <td>
                        <button pButton type="button" icon="pi pi-trash" class="p-button-danger p-button-sm" *ngIf="this.user.role.role === 'Super Admin'" (click)="deleteRole(role.id)"></button>
                    </td>
                </tr>
            </ng-template>
            <ng-template #emptymessage>
                <tr>
                    <td colspan="7">No customers found.</td>
                </tr>
            </ng-template>
        </p-table>
    </p-fluid>
</div>
