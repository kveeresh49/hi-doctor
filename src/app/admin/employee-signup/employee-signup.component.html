<p-toast></p-toast>
<p-fluid>
    <form [formGroup]="employeeForm">
        <div class="flex" style="margin-top: -0.5rem !important">
            <div class="card flex flex-col gap-6 w-full">
                <div class="font-semibold text-xl">Add Employee</div>
                <div class="flex flex-col md:flex-row gap-6">
                    <div class="flex flex-wrap gap-2 w-full">
                        <label for="firstname2">FirstName</label>
                        <input pInputText id="firstname2" type="text" formControlName="firstName" />
                    </div>
                    <div class="flex flex-wrap gap-2 w-full">
                        <label for="lastname2">LastName</label>
                        <input pInputText id="lastname2" type="text" formControlName="lastName" />
                    </div>
                </div>

                <div class="flex flex-col md:flex-row gap-6">
                    <div class="flex flex-wrap gap-2 w-full">
                        <label for="email">Email</label>
                        <input pInputText id="email" type="text" formControlName="email" />
                    </div>
                    <div class="flex flex-wrap gap-2 w-full">
                        <label for="phone">Phone</label>
                        <input pInputText id="phone" type="text" formControlName="phone" />
                    </div>
                </div>

                <div class="flex flex-col md:flex-row gap-6">
                    <div class="flex flex-wrap gap-2 w-full">
                        <label for="employeeRole">Employee Role</label>
                        <p-select id="employeeRole" optionLabel="role" [options]="roles" placeholder="Select One" class="w-full" formControlName="role"></p-select>
                    </div>
                    <div class="flex flex-wrap gap-2 w-full">
                        <label for="qualification">Qualification</label>
                        <p-select id="qualification" optionLabel="name" placeholder="Select One" class="w-full" formControlName="qualification"></p-select>
                    </div>
                </div>

                <div class="flex flex-col md:flex-row gap-6">
                    <div class="flex flex-wrap gap-2 w-full">
                        <label for="address">Address</label>
                        <input pInputText id="address" type="text" formControlName="address" />
                    </div>
                    <div class="flex flex-wrap gap-2 w-full">
                        <app-division [formGroup]="employeeForm" (onChange)="onDivisionChange($event)" [divisionName]="'division'" style="display: contents"> </app-division>
                    </div>
                </div>

                <div class="flex flex-col md:flex-row gap-6">
                    <div class="flex flex-wrap gap-2 w-full">
                        <app-country
                            [label]="'Country'"
                            [options]="companyList"
                            [optionLabel]="'label'"
                            [optionValue]="'value'"
                            [placeholder]="'Select Country'"
                            [formGroup]="employeeForm"
                            (onChange)="onCountryChange($event)"
                            style="display: contents"
                        >
                        </app-country>
                    </div>

                    <div class="flex flex-wrap gap-2 w-full">
                        <app-state [formGroup]="employeeForm" [controlName]="'state'" (onRegionChangeSateEvent)="onStateChange($event)" style="display: contents"></app-state>
                    </div>
                    <div class="flex flex-wrap gap-2 w-full">
                        <app-district [formGroup]="employeeForm" [controlName]="'district'" (onDistrictChangeEvent)="onDistrictChange($event)" [selectedStates]="selectedStatesList" style="display: contents"></app-district>
                    </div>
                    <div class="flex flex-wrap gap-2 w-full">
                        <app-city [formGroup]="employeeForm" (onCityChangeEvent)="onCityChange($event)" [selectedCities]="selectedDistricts" style="display: contents"></app-city>
                    </div>
                </div>

                <div class="flex flex-col md:flex-row gap-6 justify-center">
                    <p-button label="Submit" [disabled]="!employeeForm.valid" (onClick)="onSubmit()"></p-button>
                </div>
            </div>
        </div>
    </form>
</p-fluid>
