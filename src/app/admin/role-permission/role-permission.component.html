<div class="p-4">
  <h2 class="mb-4 text-xl font-bold">Role Area/Region Permission Mapping</h2>
  <p-table [value]="rolePermissions" [responsive]="true">
    <ng-template pTemplate="header">
      <tr>
        <th>Role</th>
        <th>Areas/Regions</th>
        <th>Edit</th>
        <th>Delete</th>
        <th>View</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-row let-i="rowIndex">
      <tr>
        <td>{{ row.role }}</td>
        <td>
          <p-multiSelect
            [options]="areas"
            [(ngModel)]="row.areas"
            display="chip"
            placeholder="Select Areas/Regions"
            [disabled]="row.role === 'Super Admin'">
          </p-multiSelect>
        </td>
        <td>
          <p-checkbox [(ngModel)]="row.canEdit"></p-checkbox>
        </td>
        <td>
          <p-checkbox [(ngModel)]="row.canDelete"></p-checkbox>
        </td>
        <td>
          <p-checkbox [(ngModel)]="row.canView"></p-checkbox>
        </td>
      </tr>
    </ng-template>
  </p-table>
  <button pButton type="button" label="Save Mappings" class="mt-4" (click)="saveMappings()"></button>
</div>
