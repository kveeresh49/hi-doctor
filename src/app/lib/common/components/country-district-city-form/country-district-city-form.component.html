<div [formGroup]="formGroup" class="flex flex-col md:flex-row gap-4">
    <div class="flex-1">
        <label>Country</label>
        <p-select [options]="countries" formControlName="{{ countryControlName }}" optionLabel="name" optionValue="code" placeholder="Select Country" [disabled]="true"> </p-select>
    </div>
    <div class="flex-1">
        <label>State/Region</label>
        <p-select [options]="states" formControlName="{{ stateControlName }}" optionLabel="label" optionValue="value" placeholder="Select State" (onChange)="onStateChange($event.value)"> </p-select>
    </div>
    <div class="flex-1">
        <label>District</label>
        <p-select [options]="districts" formControlName="{{ districtControlName }}" optionLabel="label" optionValue="value" placeholder="Select District" (onChange)="onDistrictChange($event.value)"> </p-select>
    </div>
    <div class="flex-1">
        <label>City</label>
        <p-select [options]="cities" formControlName="{{ cityControlName }}" optionLabel="label" optionValue="value" placeholder="Select City" (onChange)="onCityChange($event.value)"> </p-select>
    </div>
    <div class="flex-1">
        <label>Zip</label>
        <input pInputText formControlName="{{ zipControlName }}" placeholder="Zip" />
    </div>
</div>
